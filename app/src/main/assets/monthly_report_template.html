<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
<style>
    body { font-family: 'Inter', sans-serif; padding: 20px; color: #1e293b; line-height: 1.5; }
    .header { text-align: center; border-bottom: 2px solid #4F46E5; padding-bottom: 20px; margin-bottom: 40px; }
    .title { font-family: 'Outfit', sans-serif; font-size: 28px; font-weight: bold; text-transform: uppercase; color: #4F46E5; letter-spacing: -0.02em; }
    .subtitle { font-size: 16px; color: #64748b; margin-top: 8px; }

    .stats-container { display: flex; justify-content: space-between; margin-bottom: 40px; }
    .stat-box { flex: 1; padding: 20px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; text-align: center; margin: 0 8px; }
    .stat-label { font-size: 11px; color: #64748b; text-transform: uppercase; font-weight: bold; letter-spacing: 0.05em; }
    .stat-value { font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: bold; margin-top: 8px; }

    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th { font-family: 'Outfit', sans-serif; background: #4F46E5; color: #fff; padding: 12px; text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
    td { padding: 12px; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
    .footer { position: absolute; bottom: 30px; width: 100%; text-align: center; font-size: 11px; color: #94a3b8; border-top: 1px solid #e2e8f0; padding-top: 15px; }
</style>
</head>
<body>
    <div class="header">
        <div class="title">Bilan Mensuel d'Activité</div>
        <div class="subtitle">Période : {{reportMonth}}</div>
    </div>

    <div class="stats-container">
        <div class="stat-box">
            <div class="stat-label">Revenu Brut</div>
            <div class="stat-value" style="color: #2e7d32;">{{totalIncome}} €</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Dépenses</div>
            <div class="stat-value" style="color: #c62828;">{{totalExpenses}} €</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Bénéfice Net</div>
            <div class="stat-value" style="color: #1565c0;">{{netProfit}} €</div>
        </div>
    </div>

    <h3>Détail des documents</h3>
    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Client</th>
                <th>Type</th>
                <th>Montant</th>
                <th>Statut</th>
            </tr>
        </thead>
        <tbody>
            {{tableContent}}
        </tbody>
    </table>

    <div class="footer">
        Généré par Mes Factures - {{nomEmetteur}}
    </div>
</body>
</html>
